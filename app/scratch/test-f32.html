<!DOCTYPE html>
<html>
<body>
<script>
(async () => {
   try {
     const root = await navigator.storage.getDirectory();
     const fileHandle = await root.getFileHandle('test.bin', { create: true });
     const writable = await fileHandle.createWritable();
     const rawData = new Float32Array([1.5, -2.5, 3.14]);
     await writable.write(rawData);
     await writable.close();
     
     const rFile = await fileHandle.getFile();
     const ab = await rFile.arrayBuffer();
     const f32 = new Float32Array(ab);
     console.log("Written float32:", rawData);
     console.log("Read float32:", f32);
     document.body.innerHTML = "Success: " + f32.join(', ');
   } catch(e) {
     document.body.innerHTML = "Error: " + e.message;
   }
})();
</script>
</body>
</html>
